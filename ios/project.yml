name: CestoPartilhado
options:
  bundleIdPrefix: com.cestopartilhado
  deploymentTarget:
    iOS: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: 17.0.0

targets:
  CestoPartilhado:
    type: application
    platform: iOS
    sources:
      - path: CestoPartilhado
    resources:
      - path: CestoPartilhado/Resources
      - path: CestoPartilhado/Assets.xcassets
      - path: CestoPartilhado/GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cestopartilhado
        DEVELOPMENT_TEAM: 6L2V6Z5JJP
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: "Cesto Partilhado"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # CFBundleURLTypes: esquema do link de convite + REVERSED_CLIENT_ID do
        # GoogleService-Info.plist (exigido pelo GoogleSignIn para o callback OAuth).
    info:
      path: CestoPartilhado/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cestopartilhado
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.90825558111-8ua1j8g3il878kq8gcic2620deb83omb
          # Substitui pelo esquema real "fb<APP_ID>" quando tiveres o Facebook App
          # criado (ver docs/firebase-setup.md) — sem isto o login por Facebook
          # não consegue voltar à app depois de autenticar no browser.
          - CFBundleURLSchemes:
              - fb000000000000000
        UIBackgroundModes:
          - remote-notification
        FacebookAppID: "000000000000000"
        FacebookClientToken: "REPLACE_WITH_CLIENT_TOKEN"
        FacebookDisplayName: "Cesto Partilhado"
        LSApplicationQueriesSchemes:
          - fbapi
          - fbauth2
          - fbshareextension
    entitlements:
      path: CestoPartilhado/CestoPartilhado.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: FacebookSDK
        product: FacebookLogin
      - package: FacebookSDK
        product: FacebookCore
