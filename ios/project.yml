name: CestoPartilhado
options:
  bundleIdPrefix: pt.cestopartilhado
  deploymentTarget:
    iOS: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  CestoPartilhado:
    type: application
    platform: iOS
    sources:
      - path: CestoPartilhado
    resources:
      - path: CestoPartilhado/Resources
      - path: CestoPartilhado/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.cestopartilhado.app
        INFOPLIST_KEY_CFBundleDisplayName: "Cesto Partilhado"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # CFBundleURLTypes (esquema de convite) é injetado via info.plist customizado abaixo.
    info:
      path: CestoPartilhado/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cestopartilhado
        # Adiciona aqui também o REVERSED_CLIENT_ID do teu GoogleService-Info.plist
        # como um segundo CFBundleURLSchemes, depois de o Firebase to gerar — ver
        # docs/firebase-setup.md.
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
